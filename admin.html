<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Administrar testimonios | Dr. Henry Pacheco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">HP</div>
        <div class="logo-text">
          <strong>Dr. Henry Pacheco</strong>
          <span>Administración de testimonios</span>
        </div>
      </a>
      <a href="testimonios.html" class="btn btn-outline">Volver a testimonios</a>
    </div>
  </header>

  <main class="section admin-page">
    <div class="container">
      <div id="adminStatus" class="form-status" role="status" aria-live="polite"></div>

      <section id="adminLoginPanel" class="admin-login" aria-labelledby="adminLoginTitle">
        <form class="form" id="adminLoginForm">
          <span class="section-tag">Acceso restringido</span>
          <h1 id="adminLoginTitle">Administrar comentarios</h1>
          <p>Inicia sesión con la cuenta administradora configurada en Firebase.</p>
          <div class="form-group">
            <label for="adminEmail">Correo</label>
            <input type="email" id="adminEmail" autocomplete="username" required>
          </div>
          <div class="form-group">
            <label for="adminPassword">Contraseña</label>
            <input type="password" id="adminPassword" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary btn-full">Iniciar sesión</button>
        </form>
      </section>

      <section id="adminPanel" hidden aria-labelledby="adminTitle">
        <div class="admin-heading">
          <div>
            <span class="section-tag">Firebase</span>
            <h1 id="adminTitle">Comentarios publicados</h1>
          </div>
          <button type="button" class="btn btn-outline" id="adminLogout">Cerrar sesión</button>
        </div>
        <p class="testimonios-admin-notice">Los comentarios eliminados desaparecerán de la web y no se podrán recuperar.</p>
        <div class="testimonios-list" id="adminTestimoniosList"></div>
      </section>
    </div>
  </main>

  <script type="module" src="js/admin.js?v=1"></script>
</body>
</html>
